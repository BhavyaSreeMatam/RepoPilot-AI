version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22

  pre_build:
    commands:
      - echo "=== RepoPilot CI/CD deployment ==="
      - export REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c1-12)"
      - echo "Commit image tag = ${IMAGE_TAG}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"

  build:
    commands:
      - echo "=== Backend compile check ==="
      - python3 -m compileall backend/app

      - echo "=== Frontend lint ==="
      - cd frontend && npm ci && npm run lint && cd ..

      - echo "=== Build backend Docker image ==="
      - docker build -f backend/Dockerfile -t "${REGISTRY}/repopilot-backend:${IMAGE_TAG}" -t "${REGISTRY}/repopilot-backend:latest" backend

      - echo "=== Build frontend Docker image ==="
      - docker build -f frontend/Dockerfile -t "${REGISTRY}/repopilot-frontend:${IMAGE_TAG}" -t "${REGISTRY}/repopilot-frontend:latest" --build-arg VITE_API_BASE_URL=/api --build-arg VITE_COGNITO_USER_POOL_ID=us-east-2_AeEdIj97A --build-arg VITE_COGNITO_USER_POOL_CLIENT_ID=7gdm7be3sisub11ch2g55i59mg frontend

  post_build:
    commands:
      - echo "=== Push versioned and latest images ==="
      - docker push "${REGISTRY}/repopilot-backend:${IMAGE_TAG}"
      - docker push "${REGISTRY}/repopilot-backend:latest"
      - docker push "${REGISTRY}/repopilot-frontend:${IMAGE_TAG}"
      - docker push "${REGISTRY}/repopilot-frontend:latest"

      - echo "=== Create SSM deployment command ==="
      - |
        cat > /tmp/repopilot-ssm-params.json <<'JSON'
        {
          "commands": [
            "set -euo pipefail",
            "echo '=== Login to ECR ==='",
            "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 581645022940.dkr.ecr.us-east-2.amazonaws.com",
            "cd /opt/repopilot",
            "echo '=== Pull latest RepoPilot images ==='",
            "docker compose pull backend frontend",
            "echo '=== Recreate application containers ==='",
            "docker compose up -d --force-recreate backend frontend",
            "echo '=== Wait for backend health ==='",
            "for i in $(seq 1 40); do status=$(docker inspect --format='{{.State.Health.Status}}' repopilot-backend-1 2>/dev/null || echo starting); echo \"backend health: $status\"; if [ \"$status\" = \"healthy\" ]; then break; fi; if [ \"$status\" = \"unhealthy\" ]; then docker logs --tail 100 repopilot-backend-1; exit 1; fi; sleep 5; done",
            "test \"$(docker inspect --format='{{.State.Health.Status}}' repopilot-backend-1)\" = \"healthy\"",
            "echo '=== Verify frontend/backend through Nginx ==='",
            "curl -fsS http://127.0.0.1/ >/dev/null",
            "curl -fsS http://127.0.0.1/api/health",
            "echo '=== Running containers ==='",
            "docker compose ps",
            "docker logout 581645022940.dkr.ecr.us-east-2.amazonaws.com >/dev/null 2>&1 || true",
            "echo '=== RepoPilot deployment successful ==='"
          ]
        }
        JSON

      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --parameters file:///tmp/repopilot-ssm-params.json \
          --region "${AWS_DEFAULT_REGION}" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM command ID: ${COMMAND_ID}"

        STATUS="Pending"

        for i in $(seq 1 60); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query "Status" \
            --output text 2>/dev/null || echo "Pending")

          echo "Deployment status: ${STATUS}"

          if [ "${STATUS}" = "Success" ]; then
            break
          fi

          if [ "${STATUS}" = "Failed" ] || \
             [ "${STATUS}" = "Cancelled" ] || \
             [ "${STATUS}" = "TimedOut" ]; then

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --region "${AWS_DEFAULT_REGION}" \
              --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
              --output json || true

            exit 1
          fi

          sleep 5
        done

        if [ "${STATUS}" != "Success" ]; then
          echo "Deployment did not complete successfully."
          exit 1
        fi

        aws ssm get-command-invocation \
          --command-id "${COMMAND_ID}" \
          --instance-id "${INSTANCE_ID}" \
          --region "${AWS_DEFAULT_REGION}" \
          --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
          --output json

      - echo "=== RepoPilot CI/CD completed successfully ==="
