name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (compile + smoke)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      OPENAI_API_KEY: test-key
      DATABASE_URL: postgresql://username:password@localhost:5432/repopilot
      ENVIRONMENT: test
      AWS_REGION: us-east-2
      COGNITO_USER_POOL_ID: us-east-2_TestPool
      COGNITO_APP_CLIENT_ID: test-client
      REPOSITORY_TABLE_NAME: RepoPilotRepositories

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app

      - name: Import smoke test
        run: |
          python -c "import app.main; import app.mcp_server.server; print('RepoPilot backend import OK')"
